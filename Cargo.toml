[workspace]
resolver = "2"
members = ["crates/core", "crates/sim", "crates/wasm", "crates/mapgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ceasefire-core = { path = "crates/core" }
