<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Ceasefire Line</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=PT+Sans:wght@400;700&display=swap" />
    <link rel="icon" href="data:," />
    <style>
      :root { --panel: #1c1a17; --bronze: #b08d57; --text: #e8e1d3; --muted: #a49a88; --good: #9bc28a; --bad: #e08a7a; }
      html, body { margin: 0; height: 100%; background: #12110f; color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
      #app { position: fixed; inset: 0; touch-action: none; }
      .panel { position: fixed; background: var(--panel); border: 1px solid var(--bronze); border-radius: 6px; opacity: 0.96; }
      #top { top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; padding: 6px 12px;
             max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center; }
      #top b { color: var(--bronze); }
      #top .muted { color: var(--muted); }
      button { background: #2a2620; color: var(--text); border: 1px solid var(--bronze); border-radius: 4px; padding: 5px 12px; font: inherit; cursor: pointer; }
      button:hover { background: #3a342a; }
      #combat { bottom: 236px; left: 50%; transform: translateX(-50%); padding: 8px 14px; min-width: min(420px, calc(100vw - 24px)); display: none; text-align: center; }
      #combat .big { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
      #combat .row { display: flex; justify-content: space-between; gap: 18px; }
      #combat .detail { color: var(--muted); font-size: 12px; }
      #combat .actions { margin-top: 6px; display: flex; gap: 8px; justify-content: center; }
      #info { top: 60px; left: 10px; padding: 6px 10px; max-width: min(300px, calc(100vw - 24px)); display: none; font-size: 13px; }
      #panel { top: 60px; right: 10px; padding: 6px 10px; max-width: min(320px, calc(100vw - 24px)); }
      #panel ul { margin: 4px 0 0; padding-left: 18px; max-height: 30vh; overflow: auto; }
      .ok { color: var(--good); } .bad { color: var(--bad); }
      #modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); }
      #modal .panel { position: static; padding: 18px 24px; max-width: min(420px, calc(100vw - 32px)); text-align: center; }
      #modal h2 { margin: 0 0 8px; color: var(--bronze); }
      button:disabled { opacity: 0.45; cursor: default; }
      button.on { background: #4a3f2c; }
      #top .tabs { display: flex; gap: 4px; }
      #info .actions > div { margin-top: 6px; }
      #info select, #panel select { background: #2a2620; color: var(--text); border: 1px solid var(--bronze); border-radius: 4px; }
      #panel { max-height: calc(100vh - 140px); overflow: auto; }
      #panel table { border-collapse: collapse; margin: 4px 0; }
      #panel td { padding: 3px 6px; vertical-align: middle; }
      #panel ul.log { max-height: 60vh; font-size: 12px; }
      .muted { color: var(--muted); }
      #combat .duel { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
      #combat .card { min-width: 120px; font-size: 12px; text-align: left; }
      #combat .duel .card:last-child { text-align: right; }
      #combat .formula { text-align: left; font-size: 12px; margin-top: 6px; padding-top: 6px; border-top: 1px solid #3a342a; font-family: ui-monospace, monospace; }
      #combat .formula b { font-family: system-ui, sans-serif; display: block; margin-top: 4px; color: var(--bronze); }
      .tip { border-bottom: 1px dotted var(--muted); cursor: help; }
      #modal .menu { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
      .caps { font-family: Georgia, "Times New Roman", serif; font-variant: small-caps; letter-spacing: 0.04em; }
      /* R-UI-04 attack window and icon strip, as on the approved mock */
      #toolbar { bottom: 186px; left: 50%; transform: translateX(-50%); display: none; gap: 6px; padding: 0; align-items: center; background: none; border: none; opacity: 1; }
      #toolbar .tb { width: 38px; height: 38px; padding: 0; display: flex; align-items: center; justify-content: center; background: #24272b; border: 1px solid #8c6d3f; border-radius: 4px; color: #e6d3a8; cursor: pointer; }
      #toolbar .tb.on { background: #3d3426; border-color: #c9a46a; color: #ffe8b0; }
      #toolbar .tb:disabled { opacity: 0.4; }
      #toolbar .tb-sep { width: 1px; height: 38px; margin: 0 8px; background: #5a4a30; }
      #toolbar .tb-end { height: 38px; padding: 0 16px; background: #6b4a1f; border: 1px solid #c9a46a; border-radius: 4px; color: #f6ead0; font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
      #attack { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); display: none; width: min(1200px, calc(100vw - 16px)); }
      .aw { height: 170px; box-sizing: border-box; display: grid; grid-template-columns: 430px 1fr 430px; background: #24272b; border: 2px solid #8c6d3f; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.55); overflow: hidden; font-family: 'PT Sans', sans-serif; color: #e8e2d6; }
      .aw.single { grid-template-columns: 430px; width: 430px; margin: 0 auto 0 0; }
      .aw-card { display: flex; gap: 14px; padding: 12px 14px; align-items: flex-start; min-width: 0; }
      .aw-card.right { flex-direction: row-reverse; }
      .aw-card.right .aw-info { align-items: flex-end; }
      .aw-portrait { width: 104px; height: 124px; flex: none; box-sizing: border-box; border: 2px solid #c9a46a; border-radius: 4px; background: #2f3236; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .aw-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .aw-title { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: #f1e6cc; }
      .aw-sub { font-size: 12px; color: #b3aa98; }
      .aw-stars { font-size: 14px; color: #e6c46a; letter-spacing: 2px; }
      .aw-star-off { color: #5d5647; }
      .aw-grid { display: grid; grid-template-columns: auto auto auto auto; column-gap: 12px; row-gap: 1px; font-size: 13px; }
      .aw-l { color: #b3aa98; }
      .aw-v { font-weight: 700; }
      .aw-center { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 16px 8px 44px; background: #7a221c; border-left: 2px solid #8c6d3f; border-right: 2px solid #8c6d3f; min-width: 0; }
      .aw-arrow { position: absolute; left: 6px; top: 50%; margin-top: -17px; }
      .aw-kicker { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #f1d2cc; }
      .aw-pair { display: flex; align-items: stretch; gap: 18px; }
      .aw-col { display: flex; flex-direction: column; align-items: center; }
      .aw-big { font-family: 'Oswald', sans-serif; font-size: 44px; font-weight: 600; line-height: 1; color: #ffffff; }
      .aw-cap { font-size: 11px; color: #f1d2cc; }
      .aw-div { width: 2px; background: rgba(255,255,255,0.35); }
      .aw-lines { font-size: 10.5px; line-height: 1.35; color: #f6e2dc; text-align: center; white-space: nowrap; }
      .aw-actions { margin-top: 2px; display: flex; gap: 6px; justify-content: center; }
      .aw-actions button { padding: 2px 12px; font-family: 'Oswald', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; font-size: 12px; }
      @media (max-width: 1240px) { .aw { grid-template-columns: 1fr; height: auto; } .aw-center { border: none; border-top: 2px solid #8c6d3f; border-bottom: 2px solid #8c6d3f; } #toolbar { bottom: auto; top: 110px; flex-wrap: wrap; } #combat { bottom: auto; top: 160px; } }
      #toast { top: 64px; left: 50%; transform: translateX(-50%); padding: 8px 14px; max-width: min(520px, calc(100vw - 24px)); display: none; text-align: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="top" class="panel"></div>
    <div id="info" class="panel"></div>
    <div id="panel" class="panel"></div>
    <div id="combat" class="panel"></div>
    <div id="toolbar" class="panel"></div>
    <div id="attack"></div>
    <div id="modal"><div class="panel"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
