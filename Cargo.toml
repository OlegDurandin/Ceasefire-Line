[workspace]
resolver = "2"
members = ["crates/core", "crates/ai", "crates/sim", "crates/wasm", "crates/mapgen", "crates/tactical"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 through JSON (snapshots, saves, replays).
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
ceasefire-core = { path = "crates/core" }
ceasefire-ai = { path = "crates/ai" }
ceasefire-tactical = { path = "crates/tactical" }
